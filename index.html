<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบติดตามมติที่ประชุม</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>ระบบติดตามมติที่ประชุม</h1>
    <p class="subtitle">สำนักวิชาการ</p>
  </header>

  <main>
    <!-- แถบเครื่องมือ -->
    <section class="toolbar" id="toolbar">
      <button type="button" class="btn btn-primary" id="btn-add">+ เพิ่มรายการ</button>
      <button type="button" class="btn" id="btn-settings">ตั้งค่าผู้ส่งอีเมล</button>
      <!-- ตัวเลขสรุป (app.js เป็นผู้เติม) -->
      <div class="summary" id="summary"></div>
    </section>

    <!-- แถบตัวกรอง -->
    <section class="filters" id="filters">
      <label>
        <span>สถานะ</span>
        <select id="filter-status">
          <option value="all">ทั้งหมด</option>
          <option value="not_done">ยังไม่เสร็จ (ทุกสถานะที่ยังไม่เสร็จ)</option>
          <option value="overdue">เลยกำหนด</option>
          <option value="not_started">ยังไม่เริ่ม</option>
          <option value="in_progress">กำลังดำเนินการ</option>
          <option value="done">เสร็จแล้ว</option>
        </select>
      </label>
      <label>
        <span>ผู้รับผิดชอบ</span>
        <select id="filter-owner">
          <option value="">ทุกคน</option>
        </select>
      </label>
      <label class="grow">
        <span>ค้นหา</span>
        <input type="search" id="filter-text" placeholder="พิมพ์คำในชื่อการประชุม มติ ผู้รับผิดชอบ หรือหมายเหตุ">
      </label>
      <button type="button" class="btn" id="btn-clear-filters">ล้างตัวกรอง</button>
    </section>

    <!-- พื้นที่ตารางรายการมติ (app.js เป็นผู้สร้างตาราง) -->
    <section class="card" id="list-area">
      <p class="empty">ยังไม่มีรายการมติ</p>
    </section>
  </main>

  <footer class="app-footer">
    <span id="status-text">กำลังโหลด...</span>
  </footer>

  <!-- ===== หน้าต่างฟอร์มเพิ่ม/แก้ไขรายการ ===== -->
  <dialog id="form-dialog">
    <form id="item-form" novalidate>
      <h2 id="form-title">เพิ่มรายการ</h2>

      <div class="form-grid">
        <label class="field span-2">
          <span>ชื่อการประชุม <b class="req">*</b></span>
          <input type="text" name="meetingName" list="meeting-names" autocomplete="off"
                 placeholder="เช่น คณะกรรมการวิชาการ">
          <small class="error-msg"></small>
        </label>

        <label class="field">
          <span>ครั้งที่ <b class="req">*</b></span>
          <input type="text" name="meetingNo" placeholder="เช่น 5/2569">
          <small class="error-msg"></small>
        </label>

        <label class="field">
          <span>วันที่ประชุม <b class="req">*</b></span>
          <input type="date" name="meetingDate">
          <small class="error-msg"></small>
        </label>

        <label class="field span-2">
          <span>เรื่อง/มติ <b class="req">*</b></span>
          <textarea name="resolution" rows="3"></textarea>
          <small class="error-msg"></small>
        </label>

        <label class="field span-2">
          <span>ผู้รับผิดชอบ <b class="req">*</b></span>
          <input type="text" name="owners" placeholder="เช่น ผศ.ดร.สมชาย ใจดี, คุณสมหญิง รักงาน">
          <small class="hint">หลายคนให้คั่นด้วยจุลภาค ( , )</small>
          <small class="error-msg"></small>
        </label>

        <label class="field span-2">
          <span>อีเมล</span>
          <input type="text" name="emails" placeholder="เช่น somchai@utcc.ac.th, somying@utcc.ac.th">
          <small class="hint">หลายอีเมลให้คั่นด้วยจุลภาค ( , ) — จำเป็นสำหรับการร่างอีเมล</small>
          <small class="error-msg"></small>
        </label>

        <label class="field">
          <span>กำหนดเสร็จ <b class="req">*</b></span>
          <input type="date" name="dueDate">
          <small class="error-msg"></small>
        </label>

        <label class="field">
          <span>สถานะ <b class="req">*</b></span>
          <select name="status">
            <option value="not_started">ยังไม่เริ่ม</option>
            <option value="in_progress">กำลังดำเนินการ</option>
            <option value="done">เสร็จแล้ว</option>
          </select>
          <small class="error-msg"></small>
        </label>

        <label class="field span-2">
          <span>หมายเหตุ</span>
          <textarea name="note" rows="2"></textarea>
        </label>
      </div>

      <div class="dialog-actions">
        <button type="button" class="btn" id="btn-cancel">ยกเลิก</button>
        <button type="submit" class="btn btn-primary">บันทึก</button>
      </div>
    </form>
  </dialog>

  <!-- ===== หน้าต่างร่างอีเมล ===== -->
  <dialog id="draft-dialog" class="wide">
    <h2>ร่างอีเมลติดตามมติ</h2>
    <p class="muted small" id="draft-context"></p>
    <div class="warning" id="draft-warning" hidden></div>

    <div class="draft-field">
      <div class="draft-label">
        <span>อีเมลผู้รับ</span>
        <button type="button" class="btn btn-small btn-copy" data-copy="draft-to">คัดลอกอีเมลผู้รับ</button>
      </div>
      <input type="text" id="draft-to">
    </div>

    <div class="draft-field">
      <div class="draft-label">
        <span>หัวเรื่อง</span>
        <button type="button" class="btn btn-small btn-copy" data-copy="draft-subject">คัดลอกหัวเรื่อง</button>
      </div>
      <input type="text" id="draft-subject">
    </div>

    <div class="draft-field">
      <div class="draft-label">
        <span>เนื้อหา</span>
        <button type="button" class="btn btn-small btn-copy" data-copy="draft-body">คัดลอกเนื้อหา</button>
      </div>
      <textarea id="draft-body" rows="16"></textarea>
      <small class="hint">แก้ข้อความได้ก่อนคัดลอก (ข้อความที่แก้จะไม่ถูกเก็บไว้ ปิดแล้วเปิดใหม่จะได้ร่างเดิม)</small>
    </div>

    <!-- บันทึกการส่ง -->
    <div class="sent-box">
      <div class="sent-record">
        <label>
          <span>วันที่ส่ง</span>
          <input type="date" id="sent-date">
        </label>
        <button type="button" class="btn btn-success" id="btn-mark-sent">บันทึกว่าส่งแล้ว</button>
        <span class="sent-msg" id="sent-msg"></span>
      </div>
      <div id="sent-history"></div>
    </div>

    <div class="dialog-actions">
      <button type="button" class="btn" id="btn-draft-reset">สร้างร่างใหม่</button>
      <button type="button" class="btn btn-primary" id="btn-draft-close">ปิด</button>
    </div>
  </dialog>

  <!-- ===== หน้าต่างตั้งค่าผู้ส่ง ===== -->
  <dialog id="settings-dialog">
    <form id="settings-form" novalidate>
      <h2>ตั้งค่าผู้ส่งอีเมล</h2>
      <p class="muted small">ข้อมูลนี้ใช้ลงท้ายร่างอีเมลทุกฉบับ กรอกครั้งเดียว</p>
      <div class="form-grid">
        <label class="field span-2">
          <span>ชื่อ-นามสกุล ผู้ส่ง</span>
          <input type="text" name="senderName" placeholder="เช่น นางสาวสมใจ ตั้งใจงาน">
        </label>
        <label class="field span-2">
          <span>ตำแหน่ง</span>
          <input type="text" name="senderPosition" placeholder="เช่น เจ้าหน้าที่บริหารงานทั่วไป">
        </label>
        <label class="field span-2">
          <span>หน่วยงาน</span>
          <input type="text" name="senderOrg" placeholder="เช่น สำนักวิชาการ">
          <small class="hint">ใช้ในเนื้อหาด้วย เช่น "สำนักวิชาการจึงใคร่ขอความอนุเคราะห์..."</small>
        </label>
        <label class="field span-2">
          <span>ช่องทางติดต่อ (ไม่บังคับ)</span>
          <input type="text" name="senderContact" placeholder="เช่น โทร. 0-2697-6000 ต่อ 1234">
        </label>
      </div>
      <div class="dialog-actions">
        <button type="button" class="btn" id="btn-settings-cancel">ยกเลิก</button>
        <button type="submit" class="btn btn-primary">บันทึก</button>
      </div>
    </form>
  </dialog>

  <!-- รายชื่อการประชุมที่เคยกรอก ใช้แนะนำตอนพิมพ์ -->
  <datalist id="meeting-names"></datalist>

  <!-- ไลบรารีอ่าน/เขียน Excel (SheetJS) เก็บไว้ในเครื่อง ใช้ได้แม้ไม่มีอินเทอร์เน็ต -->
  <script src="lib/xlsx.full.min.js"></script>
  <!-- โค้ดหลักของแอป -->
  <script src="app.js"></script>
</body>
</html>
